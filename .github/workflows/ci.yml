name: TripSplit CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - "**"
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ODBC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev g++

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/expense-service/requirements.txt
          pip install -r services/settlement-service/requirements.txt
          pip install -r requirements-dev.txt
          pip install openapi-spec-validator
          pip install check-jsonschema
          python -m pip install ruff==0.11.13
      - name: Lint Assignment 2 services
        run: python -m ruff check services/

      - name: Validate OpenAPI specifications
        run: |
          openapi-spec-validator services/expense-service/openapi.yaml
          openapi-spec-validator services/settlement-service/openapi.yaml

      - name: Validate system configuration
        run: |
          check-jsonschema --schemafile system.schema.json system.yaml

      - name: Run Expense Service tests
        run: |
          python -m pytest \
            --cov=expense_service_app \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            services/expense-service/tests \

      - name: Run Settlement Service tests
        run: |
          python -m pytest \
            --cov=settlement_service_app \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            services/settlement-service/tests

  sqlserver-integration:
    name: Verify services against SQL Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start services and verify database health
        run: |
          export SQLSERVER_SA_PASSWORD="CiSql_$(openssl rand -hex 16)!"
          export EXPENSE_DB_PASSWORD="CiExpense_$(openssl rand -hex 16)!"
          export SETTLEMENT_DB_PASSWORD="CiSettlement_$(openssl rand -hex 16)!"

          trap 'if [ "$?" -ne 0 ]; then docker compose ps -a; docker compose logs --no-color sqlserver db-init expense-service settlement-service; fi' EXIT

          docker compose up -d --build expense-service settlement-service

          for port in 8000 8001; do
            curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 10 \
              --retry 30 --retry-all-errors --retry-delay 3 --retry-max-time 120 \
              "http://localhost:${port}/health" |
              jq -e '.status == "ok" and .db == "ok"'
          done

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test, sqlserver-integration]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Expense Service
        uses: docker/build-push-action@v6
        with:
          context: services/expense-service
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/main' }}
          provenance: false
          tags: ghcr.io/dakoalesia1-boop/tripsplit-expense-service:${{ github.sha }}

      - name: Build and push Settlement Service
        uses: docker/build-push-action@v6
        with:
          context: services/settlement-service
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/main' }}
          provenance: false
          tags: ghcr.io/dakoalesia1-boop/tripsplit-settlement-service:${{ github.sha }}
