{% extends "base.html" %}

{% block content %}

<h1 class="mb-4 fw-bold">
    TripSplit Groups
</h1>

<div class="card p-4 mb-4">

    <form method="POST" action="/create-group">

        <div class="input-group">

            <input
                type="text"
                name="group_name"
                class="form-control"
                placeholder="Enter group name"
                required
            >

            <button class="btn btn-primary" type="submit">
                Create Group
            </button>

        </div>

    </form>

</div>

<div class="card p-4">

    <h3 class="mb-3">Your Groups</h3>

    <div class="list-group">

        {% for group in groups %}

            <a
                href="{{ url_for('main.group_detail', group_id=group.id) }}"
                class="list-group-item list-group-item-action"
            >
                {{ group.name }}
            </a>

        {% endfor %}

    </div>

</div>

{% endblock %}
