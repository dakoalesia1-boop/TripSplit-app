server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /expense-api/ {
        proxy_pass http://expense-service:8000/;
    }

    location /settlement-api/ {
        proxy_pass http://settlement-service:8001/;
    }
}