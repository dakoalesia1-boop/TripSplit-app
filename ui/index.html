
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripSplit | Shared Expenses</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <h1>TripSplit<span>.</span></h1>
        <p>Split expenses. Keep things simple.</p>
    </header>

    <main class="container">
        <section class="welcome">
            <h2>Manage your trips</h2>
            <p>Create a group, add participants and keep track of shared expenses.</p>
        </section>

        <section class="panel">
            <h2>Your groups</h2>
            <form id="group-form">
                <input id="group-name" type="text"
                    placeholder="e.g. Barcelona Trip" required>
                <button type="submit">Create group</button>
            </form>
            <div id="groups-list"></div>
        </section>

        <div id="group-dashboard" hidden>
            <section class="panel">
                <h2 id="selected-group-name">Selected group</h2>

                <h3>Participants</h3>
                <form id="participant-form">
                    <input id="participant-name" type="text"
                        placeholder="Participant name" required>
                    <button type="submit">Add participant</button>
                </form>
                <ul id="participants-list"></ul>
            </section>

            <section class="panel">
                <h2>Add an expense</h2>
                <form id="expense-form">
                    <input id="expense-description" type="text"
                        placeholder="Description" required>
                    <input id="expense-amount" type="number"
                        min="0.01" step="0.01" placeholder="Amount" required>

                    <select id="expense-payer" required>
                        <option value="">Who paid?</option>
                    </select>

                    <input id="expense-category" type="text"
                        placeholder="Category (e.g. Food)" required>

                    <fieldset>
                        <legend>Who shares this expense?</legend>
                        <div id="expense-shares"></div>
                    </fieldset>

                    <button type="submit">Save expense</button>
                </form>
            </section>

            <section class="panel">
                <h2>Expenses</h2>
                <div id="expenses-list"></div>
            </section>

            <section class="panel">
                <h2>Balances</h2>
                <div id="balances-list"></div>
            </section>

            <section class="panel">
                <h2>Record a settlement</h2>
                <form id="settlement-form">
                    <select id="settlement-payer" required>
                        <option value="">Who pays?</option>
                    </select>

                    <select id="settlement-receiver" required>
                        <option value="">Who receives?</option>
                    </select>

                    <input id="settlement-amount" type="number"
                        min="0.01" step="0.01" placeholder="Amount" required>

                    <button type="submit">Record settlement</button>
                </form>
            </section>
        </div>

        <div id="message" role="status"></div>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
