services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: tripsplit-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
  
  db-init:
    build: ./db/init
    container_name: tripsplit-db-init
    environment:
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
      EXPENSE_DB_PASSWORD: ${EXPENSE_DB_PASSWORD}
      SETTLEMENT_DB_PASSWORD: ${SETTLEMENT_DB_PASSWORD}
    depends_on:
      - sqlserver

  expense-service:
    build: ./services/expense-service
    container_name: tripsplit-expense-service
    environment:
      PORT: 8000
      DATABASE_URL: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=sqlserver,1433;DATABASE=expense_db;UID=expense_service_user;PWD=${EXPENSE_DB_PASSWORD};Encrypt=no;TrustServerCertificate=yes"
      EXPENSE_SERVICE_URL: http://expense-service:8000
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  settlement-service:
    build: ./services/settlement-service
    container_name: tripsplit-settlement-service
    environment:
      PORT: 8001
      DATABASE_URL: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=sqlserver,1433;DATABASE=settlement_db;UID=settlement_service_user;PWD=${SETTLEMENT_DB_PASSWORD};Encrypt=no;TrustServerCertificate=yes"
      EXPENSE_SERVICE_URL: http://expense-service:8000
    depends_on:
      db-init:
        condition: service_completed_successfully
      expense-service:
        condition: service_started
    ports:
      - "8001:8001"

  frontend:
    image: nginx:alpine
    container_name: tripsplit-frontend
    ports:
      - "8080:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - expense-service
      - settlement-service
volumes:
  sqlserver-data: